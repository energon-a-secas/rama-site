# Rama org document. Schema and examples: https://rama.neorgon.com/llms.txt
# Lanternfish Systems is invented: every name, address and number below is
# fictional (.example domains, 555-01xx numbers). Replace it with your own org.
rama: 1
title: Lanternfish Systems
notes: |
  A made-up company of 55 people and 3 open roles across four continents.
  Click anyone to see where they sit, walk the reporting lines with the arrow
  keys, or open **Overview** for the whole org at once. The Revenue Platform division is the same team
  as Floorplan's example, so **Hand off > Floorplan** shows it as rooms.

# Built-in roles (ceo, eng-manager, senior-engineer and about thirty more) need
# no declaring. Declare one here to add it or to change a built-in's title.
roles:
  payments-engineer: { title: Payments Engineer, track: ic, level: IC3 }
  staff-engineer: { title: Staff Engineer, track: ic, level: IC5, color: "#22d3ee" }

# Any key a person carries that is not a core key is kept and shown under
# Details. Declare it here to give it a label, a type, and a place in the order.
fields:
  pronouns: Pronouns
  wiki: { label: Wiki page, type: url, prefix: "https://wiki.lanternfish.example/people/" }
  phone: { label: Desk phone, type: phone }
  oncall: On-call
  costCentre: { label: Cost centre, hidden: true }

# Reusable bits of a person, applied with `extends:` (scalars override, tags merge).
profiles:
  revenue: { costCentre: CC-410, tags: [payments] }
  agency: { employment: vendor, notes: "Through Northbank Partners, renewed quarterly." }

